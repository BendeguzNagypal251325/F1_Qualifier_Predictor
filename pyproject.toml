[project]
name = "f1qp"
version = "0.1.0"
description = "F1 top-10 qualifying predictor (Ridge regression)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
]

[project.scripts]
f1qp-data = "f1qp.data:main"
f1qp-train = "f1qp.train:main"
f1qp-predict = "f1qp.predict:main"
f1qp-build = "f1qp.build:main"
f1qp-serve = "f1qp.server:main"
f1qp-live = "f1qp.live:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1qp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
