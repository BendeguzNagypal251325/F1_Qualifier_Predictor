<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gridcast: out-of-sample Formula 1 qualifying forecasts, with driver, car and team breakdowns and live weekend updates." />
    <meta name="theme-color" content="#09090d" />
    <title>Gridcast</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Start the main data request while the app code is still downloading. -->
    <link rel="preload" href="/api/meta" as="fetch" crossorigin="anonymous" />
    <style>
      /* Boot screen: drawn before any JavaScript runs, removed by the app when the data is in. */
      html, body { margin: 0; } html { background: #09090d; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #09090d; overflow: hidden; transition: opacity 0.45s ease, visibility 0.45s; font-family: "Saira Condensed", "Arial Narrow", sans-serif; }
      #boot.out { opacity: 0; visibility: hidden; }
      #boot .inner { display: grid; justify-items: center; gap: 26px; position: relative; z-index: 1; }
      #boot .word { font-weight: 800; font-size: 44px; letter-spacing: 0.04em; color: #fff; transform: skewX(-8deg); }
      #boot .word b { color: #ff2a3a; font-weight: 800; }
      #boot .lights { display: flex; gap: 14px; padding: 12px 16px; background: #050507; border-radius: 10px; box-shadow: inset 0 0 0 1px #24242e; }
      #boot .lights i { width: 26px; height: 26px; border-radius: 50%; background: #1c1c24; box-shadow: inset 0 -3px 6px rgb(0 0 0 / 0.6); animation: light-on 0.01s linear forwards; animation-delay: calc(var(--n) * 0.22s + 0.1s); }
      #boot.out .lights i { background: #1c1c24 !important; box-shadow: none !important; }
      #boot .tag { color: #8d8d99; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; }
      #boot .streak { position: absolute; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, #ff2a3a); box-shadow: 0 0 10px #ff2a3a; opacity: 0.7; transform: rotate(-18deg); animation: streak 1.4s linear infinite; }
      @keyframes light-on { to { background: #ff2a3a; box-shadow: 0 0 18px #ff2a3a, inset 0 -3px 6px rgb(0 0 0 / 0.3); } }
      @keyframes streak { from { translate: -60vw 0; } to { translate: 60vw 0; } }
      /* First visit: the full start sequence. Lights on one per 0.6 s, hold, then lights out. */
      #boot.intro .lights i { animation-delay: calc(var(--n) * 0.6s + 0.35s); }
      #boot.intro.go .lights i { animation: none; background: #1c1c24; box-shadow: inset 0 -3px 6px rgb(0 0 0 / 0.6); }
      #boot.intro.go .tag { color: #fff; }
      @media (prefers-reduced-motion: reduce) { #boot .streak { animation: none; } #boot .lights i { animation-duration: 0s; animation-delay: 0s; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Gridcast">
      <span class="streak" style="top: 22%; left: 10%; width: 38vw; animation-delay: -0.2s"></span>
      <span class="streak" style="top: 38%; left: 40%; width: 26vw; animation-delay: -0.9s"></span>
      <span class="streak" style="top: 70%; left: 5%; width: 44vw; animation-delay: -0.5s"></span>
      <span class="streak" style="top: 84%; left: 50%; width: 30vw; animation-delay: -1.2s"></span>
      <div class="inner">
        <div class="word">GRID<b>CAST</b></div>
        <div class="lights"><i style="--n: 0"></i><i style="--n: 1"></i><i style="--n: 2"></i><i style="--n: 3"></i><i style="--n: 4"></i></div>
        <div class="tag">Formula 1 qualifying forecasts</div>
      </div>
    </div>
    <script>
      // Only the very first visit gets the whole sequence; later visits leave as soon as the data is in.
      (function () {
        var boot = document.getElementById("boot"), first = false;
        try { first = !localStorage.getItem("gridcast-intro"); localStorage.setItem("gridcast-intro", "1"); } catch (e) {}
        if (!first || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        boot.classList.add("intro");
        window.__bootHold = new Promise(function (done) {
          setTimeout(function () {
            boot.classList.add("go");
            boot.querySelector(".tag").textContent = "Lights out";
            setTimeout(done, 650);
          }, 3700);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
